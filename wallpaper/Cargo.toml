[package]
name = "orchard-wallpaper"
version = "0.1.0"
edition = "2024"
description = "Neutral colour schemes from the wallpaper sway is showing"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "qoi"] }
libc = "0.2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
